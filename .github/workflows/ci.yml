name: Continuous integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: bandit -r app -ll
      - run: pip-audit -r requirements.txt
      - run: pytest

      - name: Retain test and coverage evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-evidence
          path: |
            test-results.xml
            coverage.xml
          if-no-files-found: warn

  container:
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - name: Build image
        run: |
          docker build --pull \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            -t "tracker:${GITHUB_SHA}" .

      - name: Scan the exact built image
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: tracker:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: false
          format: table

      - name: Start container and verify API
        shell: bash
        run: |
          set -euo pipefail

          docker run -d --name tracker \
            --read-only \
            --tmpfs /tmp \
            --tmpfs /data:uid=10001,gid=10001 \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            -p 127.0.0.1:8000:8000 \
            "tracker:${GITHUB_SHA}"

          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/readyz; then
              break
            fi
            sleep 2
          done

          curl -fsS http://127.0.0.1:8000/readyz

          curl -fsS \
            -H 'Content-Type: application/json' \
            -d '{"title":"Container integration check"}' \
            http://127.0.0.1:8000/api/requests

          curl -fsS http://127.0.0.1:8000/api/requests |
            python -c 'import json,sys; rows=json.load(sys.stdin); assert rows[0]["title"] == "Container integration check"'

      - name: Publish tested image to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"

          printf '%s' "${GHCR_TOKEN}" |
            docker login ghcr.io \
              --username "${GITHUB_ACTOR}" \
              --password-stdin

          docker tag "tracker:${GITHUB_SHA}" "${IMAGE}:${GITHUB_SHA}"
          docker push "${IMAGE}:${GITHUB_SHA}"

          docker image inspect "${IMAGE}:${GITHUB_SHA}" \
            --format '{{json .RepoDigests}}' > image-digest.txt

          {
            echo "### Published container image"
            echo
            echo "Image: ${IMAGE}:${GITHUB_SHA}"
            echo
            echo "Registry digest:"
            cat image-digest.txt
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Retain published image digest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v6
        with:
          name: published-image-digest
          path: image-digest.txt
          if-no-files-found: error

      - name: Log out of registry
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker logout ghcr.io

      - name: Retain container logs
        if: always()
        run: docker logs tracker > container.log 2>&1 || true

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: container-evidence
          path: container.log

      - name: Remove test container
        if: always()
        run: docker rm -f tracker || true