name: Continuous integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: bandit -r app -ll
      - run: pip-audit -r requirements.txt
      - run: pytest

      - name: Validate monitoring and logging configuration
        shell: bash
        run: |
          set -euo pipefail

          docker run --rm \
            --entrypoint promtool \
            -v "${PWD}/monitoring:/etc/prometheus:ro" \
            prom/prometheus:v3.16.0 \
            check config /etc/prometheus/prometheus.yml

          docker run --rm \
            -v "${PWD}/monitoring:/config:ro" \
            grafana/loki:3.7.10 \
            -config.file=/config/loki.yml \
            -verify-config=true

          docker run --rm \
            -v "${PWD}/monitoring:/etc/alloy:ro" \
            grafana/alloy:v1.22.0 \
            validate /etc/alloy/config.alloy

      - name: Retain test and coverage evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-evidence
          path: |
            test-results.xml
            coverage.xml
          if-no-files-found: warn

  container:
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - name: Build image
        run: |
          docker build --pull \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            -t "tracker:${GITHUB_SHA}" .

      - name: Scan the exact built image
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: tracker:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: false
          format: table

      - name: Start container and verify API
        shell: bash
        run: |
          set -euo pipefail

          docker run -d --name tracker \
            --read-only \
            --tmpfs /tmp \
            --tmpfs /data:uid=10001,gid=10001 \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            -p 127.0.0.1:8000:8000 \
            "tracker:${GITHUB_SHA}"

          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/readyz; then
              break
            fi
            sleep 2
          done

          curl -fsS http://127.0.0.1:8000/readyz

          curl -fsS \
            -H 'Content-Type: application/json' \
            -d '{"title":"Container integration check"}' \
            http://127.0.0.1:8000/api/requests

          curl -fsS http://127.0.0.1:8000/api/requests |
            python -c 'import json,sys; rows=json.load(sys.stdin); assert rows[0]["title"] == "Container integration check"'

      - name: Publish tested image to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"

          printf '%s' "${GHCR_TOKEN}" |
            docker login ghcr.io \
              --username "${GITHUB_ACTOR}" \
              --password-stdin

          docker tag "tracker:${GITHUB_SHA}" "${IMAGE}:${GITHUB_SHA}"
          docker push "${IMAGE}:${GITHUB_SHA}"

          docker image inspect "${IMAGE}:${GITHUB_SHA}" \
            --format '{{json .RepoDigests}}' > image-digest.txt

          {
            echo "### Published container image"
            echo
            echo "Image: ${IMAGE}:${GITHUB_SHA}"
            echo
            echo "Registry digest:"
            cat image-digest.txt
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Retain published image digest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v6
        with:
          name: published-image-digest
          path: image-digest.txt
          if-no-files-found: error

      - name: Log out of registry
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker logout ghcr.io

      - name: Retain container logs
        if: always()
        run: docker logs tracker > container.log 2>&1 || true

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: container-evidence
          path: container.log

      - name: Remove test container
        if: always()
        run: docker rm -f tracker || true
  deploy:
    needs: container
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - name: Download this run's published image digest
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "${GITHUB_RUN_ID}" --name published-image-digest

      - name: Authenticate to AWS using OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::077815499909:role/atu-github-deploy
          aws-region: eu-west-1
          allowed-account-ids: '077815499909'
          role-session-name: atu-deploy-${{ github.run_id }}

      - name: Prepare deployment command
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import io
          import json
          import pathlib
          import re
          import tarfile

          digests = json.loads(pathlib.Path("image-digest.txt").read_text())
          if not isinstance(digests, list) or len(digests) != 1:
              raise SystemExit("Expected exactly one published image digest.")
          image = digests[0]
          if not re.fullmatch(
              r"ghcr\.io/l00068839/atu-request-tracker@sha256:[a-f0-9]{64}",
              image,
          ):
              raise SystemExit("Unexpected image digest.")

          archive = io.BytesIO()
          with tarfile.open(fileobj=archive, mode="w:gz") as bundle:
              for name in (
                  "scripts/bootstrap-k3s.sh",
                  "scripts/deploy.sh",
                  "k8s",
                  "scripts/deploy-monitoring.sh",
                  "monitoring",
              ):
                  bundle.add(name, arcname=name)

          payload = base64.b64encode(archive.getvalue()).decode("ascii")
          command = "\n".join([
              "set -eu",
              "DEPLOY_DIR=$(mktemp -d)",
              "trap 'rm -rf \"$DEPLOY_DIR\"' EXIT",
              f"printf '%s' '{payload}' | base64 -d | tar -xz -C \"$DEPLOY_DIR\"",
              f'bash "$DEPLOY_DIR/scripts/deploy.sh" \'{image}\'',
          ])
          request = {
              "DocumentName": "AWS-RunShellScript",
              "InstanceIds": ["i-06bb48983057e1c8e"],
              "Comment": "ATU GitHub Actions deployment",
              "TimeoutSeconds": 120,
              "Parameters": {
                  "commands": [command],
                  "executionTimeout": ["1200"],
              },
          }
          pathlib.Path("ssm-request.json").write_text(json.dumps(request))
          pathlib.Path("deployed-image.txt").write_text(image + "\n")
          PY

      - name: Deploy and check result
        shell: bash
        run: |
          set -euo pipefail

          COMMAND_ID=$(aws ssm send-command \
            --cli-input-json file://ssm-request.json \
            --query 'Command.CommandId' --output text)

          echo "SSM command: ${COMMAND_ID}"

          for attempt in {1..270}; do
            if aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id i-06bb48983057e1c8e \
              > deployment-result.json 2> deployment-poll-error.txt; then

              STATUS=$(python3 -c \
                'import json; print(json.load(open("deployment-result.json"))["Status"])')

              case "${STATUS}" in
                Success)
                  python3 -c \
                    'import json; r=json.load(open("deployment-result.json")); print(r["StandardOutputContent"])'
                  {
                    echo "### AWS deployment succeeded"
                    echo
                    cat deployed-image.txt
                    echo
                    echo "Instance: i-06bb48983057e1c8e"
                    echo "Rollout and application readiness checks passed."
                  } >> "${GITHUB_STEP_SUMMARY}"
                  exit 0
                  ;;
                Pending|InProgress|Delayed)
                  ;;
                *)
                  cat deployment-result.json
                  exit 1
                  ;;
              esac
            fi
            sleep 5
          done

          echo "Timed out waiting for the deployment result."
          cat deployment-result.json deployment-poll-error.txt || true
          exit 1

      - name: Retain deployment evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: deployment-evidence
          path: |
            deployed-image.txt
            deployment-result.json
            deployment-poll-error.txt
          if-no-files-found: warn
